name: Check and publish lecture notes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lecture-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LECTURE_VALIDATION_DIR: ${{ runner.temp }}/lecture-qa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install reproducible runtime
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify committed edition and stage public files
        shell: bash
        run: |
          python figures/make_figures.py
          python labs/ch15.py --figure figures/ch15-payoff-atlas.svg
          python tools/build.py
          git diff --exit-code -- '*.html' book.json 'figures/*.svg' 'assets/figures/*.svg'
          site="$RUNNER_TEMP/lecture-pages"
          mkdir -p "$site"
          git archive HEAD | tar -x -C "$site"
          cd "$site"
          python tools/check.py
          python tools/audit_book.py
          python tools/release_check.py
          python tools/browser_check.py
      - name: Upload checked site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/lecture-pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
